# Render Blueprint: 無料の Web Service を作る（データベースは Neon の PostgreSQL を使う）
# 注意: 無料 Web は15分アクセスがないとスリープする
services:
  - type: web
    name: ohalog
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY_BASE   # master.key を共有せず、Render 側で自動生成する
        generateValue: true
      - key: DATABASE_URL   # Neon の接続文字列（sslmode=require 付き）。秘密情報なので Render の画面から設定する
        sync: false
